[package]
name = "mneme"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "query", "tokio"] }
clap = { version = "4.6.7", features = ["derive"] }
futures-util = { version = "0.3.34", default-features = false }
comrak = { version = "0.59.0", default-features = false }
gix = { version = "0.90.0", default-features = false, features = ["sha1", "blob-diff"] }
rusqlite = { version = "0.42.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
subtle = "2.6.1"
similar = { version = "3.2.1", features = ["inline"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["io-util", "net", "process", "rt-multi-thread", "signal", "sync"] }
ureq = { version = "3.5.1", default-features = false, features = ["rustls"] }

[lints.rust]
unsafe_code = "forbid"
unsafe_op_in_unsafe_fn = "deny"
unexpected_cfgs = "deny"

[lints.cargo]
unused_dependencies = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"

[dev-dependencies]
fastrand = "2.5.0"
flate2 = "1.1.11"
tempfile = "3.27.0"

[profile.release]
lto = "thin"
