[package]
name = "mneme"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
comrak = { version = "0.59.0", default-features = false }
similar = { version = "3.2.1", features = ["inline"] }

[lints.rust]
unsafe_code = "forbid"
unsafe_op_in_unsafe_fn = "deny"
unexpected_cfgs = "deny"

[lints.cargo]
unused_dependencies = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"

[profile.release]
lto = "thin"
