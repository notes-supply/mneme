# What a Mneme release may change: the Deployment. The cluster's own repository owns the rest
# of the namespace and adds its specifics as an overlay: the Services, the ingress, the network
# policy, the tokens Secret and the repository's volume, which this Deployment mounts by name.
# Mneme reads the tokens file at start, so whatever changes the Secret should restart it.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - deployment.yaml
